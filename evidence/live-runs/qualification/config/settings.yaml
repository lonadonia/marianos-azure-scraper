# Collection rules, the page providers and validation thresholds. Every value is recorded with each run.
acquisition:
  mode: UI_CAPTURE
  # The provider every run of this configuration collects with (one per run, never switched silently):
  # - oxylabs (release 1.3.0, the selected route): the Oxylabs Web API's Mariano's search scraper, the store
  #   and fulfillment sent as request parameters and verified on every page; key only from
  #   OXYLABS_WEB_API_KEY or OXYLABS_WEB_API_KEY_FILE; spending limited by `set-ceiling` (no balance API).
  # - scrapfly: Scrapfly Cloud Browser over CDP (refused by the retailer's edge on 2026-10-28: see
  #   PROVIDER_COMPARISON); key only from SCRAPFLY_API_KEY or SCRAPFLY_API_KEY_FILE.
  browser_provider: oxylabs
  scrapfly:
    proxy_pool: residential         # chosen before the first request; never switched after a refusal
    country: us
    # The provider's `os` parameter (null = the provider picks a platform per session). Tested live on
    # 2026-10-23 with `macos`: the provider's browsers still reported Linux, then Windows, and both were
    # served, so the setting's effect is not established and the provider's choice is kept
    # (docs/DIAGNOSIS_403.md). Chosen before the first request, never switched after a refusal.
    browser_os: null
    target_url: https://www.marianos.com/
    block_images: true              # stubbed by the provider; image URLs stay in the page
    block_fonts: true
    block_media: true
    block_styles: false
    blacklist: true                 # analytics/tracking stubs
    cache: true
    session_timeout_s: 1800         # the provider's maximum (30 min); a new session opens after 60 % of it
    max_credits_per_run: 300        # one browser session's own cap, only when no run, day or account budget applies
    bandwidth_overhead_factor: 2.0  # billed / page-meter traffic: 1.7 (10-20), 1.3, 1.9 and 1.8 (10-23)
  headless: true
  navigation_min_interval_s: 4.0
  navigation_interval_jitter_s: 1.0
  page_load_timeout_s: 45
  response_wait_timeout_s: 30
  # A page opened once per browser session before the first listing (e.g. https://www.marianos.com/);
  # null opens the listing directly.
  entry_url: null
retries: { max_attempts_per_task: 3, backoff_base_s: 10, backoff_max_s: 300, pause_on_429_s: 600, max_retry_after_s: 1800 }
circuit_breaker: { consecutive_failures_to_fail_category: 5, challenge_pages_to_abort_run: 1 }
# partition_large_listings: a listing whose total exceeds the site's result window (availableCount) is read
# through the child listings the site's category facet names for it (release 1.2.1).
coverage:
  { node_min_coverage_ratio: 0.98, row_fail_below_ratio: 0.90, allow_paid_only_membership: false,
    partition_large_listings: true }
yield: { warn_drop_vs_last_good: 0.30, fail_drop_vs_last_good: 0.50 }
attestation:
  periodic_every_navigations: 25
  # Phase 0 deliverable: the modality `source` the site reports after an explicit store selection.
  # Until it is recorded, A3 fails and no run can publish.
  trusted_modality_sources: []
  require_is_trusted_source: true
records:
  exclude_ship_only: true
  # The client's rule (release 1.4.0): approx / approximately / avg / average / estimated, "~" or "about"
  # before a quantity, and a weight range ("10-14 lb"). Selling by weight ("about $1.64 each", "$2.39/lb")
  # is not an exclusion: the per-unit price is the PPM and the estimated item price is never exported as a
  # fixed price.
  approx_weight_pattern: '(?i)\b(approx\.?|approximately|avg\.?|average|estimated)(?=[\s\d.]|$)|~\s*\d|\babout\s+\d|\b\d+(\.\d+)?\s*(-|to)\s*\d+(\.\d+)?\s*(lb|lbs|pound|pounds|oz|ounce|ounces|kg|g)\b'
  # Where the rule reads the product's weight (release 1.5.0): the displayed weight, the size the site's own
  # product data states (a whole turkey sold by weight: "$0.98/lb" in the size slot, "10-14 lb" in its data),
  # and a weight range in the name of a product sold by weight when no weight is displayed. [weight] alone is
  # the 1.4.0 rule.
  approx_weight_sources: [weight, product_data_size, title]
  store_brand_positive_value: "yes"
  include_cashback_in_digital: false
  include_points_offers_in_deals: false
  other_promo_target: NONE
  deal_description_format: TAG_TEXT_EXPIRY
  ppm_source_policy: DOM_ONLY
  primary_category_policy: CSV_ORDER_COUPONS_LAST
  sub_category_format: LEAF
  crawl_date: STORE_LOCAL_DATE
  fail_on_price_mismatch: true
gates:
  coverage_warn_below: 0.98
  coverage_fail_below: 0.90
  price_completeness_warn_below: 0.98
  reconciliation_warn_above: 0.005
  reconciliation_fail_above: 0.02
  canary_missing_is_fail: false
contest: { enabled: true, min_valid_records: 500, min_categories: 3 }
# local: a folder (MARIANOS_COLLECTOR_DATA_DIR overrides local_root). In Azure the job sets
# MARIANOS_COLLECTOR_STORAGE=azure_blob with the account URL and container (managed identity, no key).
storage: { backend: local, local_root: ./data }
